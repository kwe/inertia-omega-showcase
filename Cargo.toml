[package]
name = "omega-showcase"
version = "0.1.0"
edition = "2024"
publish = false
description = "A showcase of Inertia.js v3 features, served by Axum through inertia-omega"

[dependencies]
# The crate's library name is `inertia`.
inertia-omega = { git = "https://github.com/inertiajs/inertia-omega", rev = "6667d8d" }
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "signal"] }
tower-sessions = { version = "0.15", features = ["memory-store"] }
tower-http = { version = "0.6", features = ["fs", "trace"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
